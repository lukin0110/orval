services:
  # Container definition for the devcontainer
  devcontainer:
    build:
      context: .
      args:
        PYTHON_VERSION: ${PYTHON_VERSION:-3.14.3}
      target: dev
    stdin_open: true
    tty: true
    # Load an optional .env file (the path/required syntax needs Docker Compose v2.24+)
    env_file:
      - path: .env
        required: false
    volumes:
      - .:/workspaces/orval/

volumes:
  claude-code-config:

networks:
  default:
    name: orval-network
