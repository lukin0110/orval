name: Lint and Test

on:
  push:
    branches:
      - main
      - master
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ "3.14.3" ]
    name: Python ${{ matrix.python-version }}
    steps:
      # https://github.com/actions/checkout
      - name: Checkout
        uses: actions/checkout@v7

      # https://github.com/docker/setup-buildx-action
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Build the dev stage of the Dockerfile, cached in the GitHub Actions cache per Python version.
      # https://github.com/docker/build-push-action
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: dev
          tags: orval-dev
          load: true
          build-args: PYTHON_VERSION=${{ matrix.python-version }}
          cache-from: type=gha,scope=python-${{ matrix.python-version }}
          cache-to: type=gha,mode=max,scope=python-${{ matrix.python-version }}

      # Mount the checkout over the workdir: lint needs .git, and the coverage report lands in reports/.
      - name: Run lint
        run: docker run --rm -v "$PWD:/workspaces/orval" orval-dev poe lint

      - name: Run test
        run: docker run --rm -v "$PWD:/workspaces/orval" orval-dev poe test
