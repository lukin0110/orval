[project]  # https://packaging.python.org/en/latest/specifications/pyproject-toml/
name = "orval"
version = "0.0.11"
description = "A Python package containing a small set of utility functions not found in Python's standard library. It is lightweight, written in pure Python, and has no dependencies."
authors = [
  { name = "Maarten Huijsmans", email = "maarten@lukin.be" },
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.11.0,<4.0"
classifiers = [
    "Typing :: Typed",
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Internet",
    "Topic :: Utilities",
]

[project.urls]
homepage = "https://github.com/lukin0110/orval/"
source = "https://github.com/lukin0110/orval/"

[build-system]  # https://docs.astral.sh/uv/concepts/build-backend/
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "coverage[toml] (>=7.13.4,<8.0.0)",
    "ipython (>=9.10.0)",
    "ty (>=0.0.74)",
    "poethepoet (>=0.29.0)",
    "pre-commit (>=4.5.1)",
    "pytest (>=9.1.1)",
    "pytest-clarity (>=1.0.1)",
    "pytest-mock (>=3.15.1)",
    "ruff (>=0.16.4)",
    "safety (>=3.7.0,<4.0.0)",
    "typeguard (>=4.5.1)",
]

[tool.coverage.report]  # https://coverage.readthedocs.io/en/latest/config.html#report
fail_under = 91
precision = 1
show_missing = true
skip_covered = true

[tool.coverage.run]  # https://coverage.readthedocs.io/en/latest/config.html#run
branch = true
command_line = "--module pytest"
data_file = "reports/.coverage"
source = ["src"]

[tool.coverage.xml]  # https://coverage.readthedocs.io/en/latest/config.html#xml
output = "reports/coverage.xml"

[tool.ty.environment]  # https://docs.astral.sh/ty/configuration/
python-version = "3.14"
root = ["./src"]

# [tool.ty.terminal]
# output-format = "github"

[tool.ty.rules]
unused-ignore-comment = "warn"

[tool.pytest.ini_options]  # https://docs.pytest.org/en/latest/reference/reference.html#ini-options-ref
addopts = "--color=yes --doctest-modules --exitfirst --failed-first --strict-config --strict-markers --typeguard-packages=orval --verbosity=2 --junitxml=reports/pytest.xml"
filterwarnings = ["error", "ignore::DeprecationWarning"]
testpaths = ["src", "tests"]
xfail_strict = true
log_file_level = "info"
pythonpath = "src"

[tool.ruff]  # https://github.com/charliermarsh/ruff
fix = true
line-length = 120
src = ["src", "tests"]
target-version = "py313"
force-exclude = true  # https://docs.astral.sh/ruff/settings/#force-exclude
preview = true  # https://docs.astral.sh/ruff/preview/

[tool.ruff.lint]  # https://github.com/charliermarsh/ruff
ignore = ["D10", "boolean-default-value-positional-argument", "logging-f-string", "incorrect-blank-line-before-class", "multi-line-summary-second-line", "line-too-long", "raw-string-in-exception", "f-string-in-exception", "boolean-type-hint-positional-argument", "single-line-implicit-string-concatenation", "unnecessary-assign", "assert", "raise-vanilla-args", "try-consider-else", "doc-line-too-long"]
select = ["A", "ASYNC", "B", "BLE", "C4", "C90", "D", "DTZ", "E", "EM", "ERA", "F", "FBT", "FLY", "FURB", "G", "I", "ICN", "INP", "INT", "ISC", "LOG", "N", "NPY", "PERF", "PGH", "PIE", "PLC", "PLE", "PLR", "PLW", "PT", "PTH", "PYI", "RET", "RSE", "RUF", "S", "SIM", "SLF", "SLOT", "T10", "T20", "TCH", "TID", "TRY", "UP", "W", "YTT"]
unfixable = ["commented-out-code", "unused-import", "unused-variable", "print", "p-print"]  # https://docs.astral.sh/ruff/settings/#unfixable

[tool.ruff.lint.extend-per-file-ignores] # https://docs.astral.sh/ruff/settings/#extend-per-file-ignores
# Ignore missing __init__.py files in tests.
"tests/*" = ["implicit-namespace-package", "magic-value-comparison"]
# strip_styling docstring intentionally shows ambiguous-unicode examples.
"src/orval/strings.py" = ["ambiguous-unicode-character-docstring"]
# strip_styling tests intentionally feed in ambiguous-unicode inputs.
"tests/test_strings.py" = ["ambiguous-unicode-character-string"]
# Duration formatting intentionally uses the µ (micro) sign for microseconds.
"src/orval/duration_utils.py" = ["ambiguous-unicode-character-string"]
# Duration tests intentionally assert on µs-formatted output.
"tests/test_duration_utils.py" = ["ambiguous-unicode-character-string"]

[tool.ruff.lint.flake8-tidy-imports]
# Disallow all relative imports.
ban-relative-imports = "all"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pep8-naming]
# Allow Pydantic's `@validator` decorator to trigger class method treatment.
classmethod-decorators = ["classmethod", "pydantic.validator", "pydantic.root_validator"]

[tool.ruff.lint.pycodestyle]
max-doc-length = 100

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.poe.tasks] # https://poethepoet.natn.io/index.html
    [tool.poe.tasks.lint]
    help = "Lint this package"

    [[tool.poe.tasks.lint.sequence]]
    shell = '[ -d ".git" ] || { echo "\n\\033[0;31mGit is not initialized in this directory. Please run \"git init\" to fix linting.\\033[0m\n"; exit 1; }'

    [[tool.poe.tasks.lint.sequence]]
    cmd = """
    pre-commit run
        --all-files
        --color always
    """


    [tool.poe.tasks.safety]
    help = "Run safety checks on this package"
    shell = "safety scan --continue-on-error --full-report"


    [tool.poe.tasks.test]
    help = "Test this package"

    [[tool.poe.tasks.test.sequence]]
    cmd = "coverage run"

    [[tool.poe.tasks.test.sequence]]
    cmd = "coverage report"

    [[tool.poe.tasks.test.sequence]]
    cmd = "coverage xml"
